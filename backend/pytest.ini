[pytest]
# Infrastructure test suite configuration (backend/tests/).
#
# asyncio_mode = auto lets the suite drive coroutines directly without an
# explicit @pytest.mark.asyncio on every test. It is set here (rather than only
# in the suite) so `pytest tests/` picks it up regardless of the directory it is
# invoked from.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests

markers =
    slow: takes more than a second (the end-to-end pipeline runs)

# -ra: show a summary of why each skipped/xfailed test was skipped.
# --strict-markers: a typo'd marker is an error, not a silent no-op.
# -p no:cacheprovider: don't write a .pytest_cache directory into backend/.
#
# The agent modules print their step lines via print() in BaseAgent.log. pytest
# captures that output automatically, so a passing run stays readable; pass -s to
# re-enable it when debugging a failing pipeline.
addopts = -ra --strict-markers -p no:cacheprovider