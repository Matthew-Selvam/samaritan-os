; supervisor configuration for the Signal-OS all-in-one image.
;
; Two long-running processes share one container:
;   backend  — FastAPI/uvicorn on :8766 (the real health contract)
;   frontend — Next.js production server on :3001
;
; The container image installs the Debian `supervisor` package, so the stock
; include path applies and this file is dropped into conf.d/.

[supervisord]
nodaemon=true
user=signal
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── Backend ─────────────────────────────────────────────────────────────────
[program:backend]
command=/usr/local/bin/uvicorn main:app
    --host 0.0.0.0
    --port 8766
    --workers %(ENV_WORKERS)s
    --proxy-headers
    --forwarded-allow-ips=*
directory=/app
autostart=true
autorestart=true
; Give the investigation pipeline room to finish an in-flight request before
; supervisor escalates to a hard kill. A single agent is allowed up to
; config.py's per-agent TIMEOUT_* (max 60s); 120s leaves headroom for the
; correlation tier on top of that.
startsecs=10
startretries=3
stopsignal=TERM
; Longer than Docker's 10s default stop window, so `docker stop` sends SIGTERM,
; uvicorn drains, and only then does Docker escalate to SIGKILL.
stopwaitsecs=120
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
priority=10

; ── Frontend ────────────────────────────────────────────────────────────────
[program:frontend]
command=/usr/local/node/bin/node server.js
directory=/app/frontend
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=20
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=PORT="3001",HOSTNAME="0.0.0.0",NODE_ENV="production"
priority=20

; ── Celery worker ───────────────────────────────────────────────────────────
; Started by `make` / compose in the split deployment; included here so the
; all-in-one image gives the same task execution the spec promises. The worker
; connects to REDIS_URL and exits non-zero if the broker is absent, so it is
; autostart=false: on a single-container deploy with no Redis the operator
; opts in explicitly rather than getting a crash-looping process by default.
[program:celery]
command=/usr/local/bin/celery -A celery_app.celery_app worker
    --loglevel=INFO
    --concurrency=2
    -Q signal_os
directory=/app
autostart=false
autorestart=true
startsecs=15
startretries=3
stopsignal=TERM
; task_time_limit is 600s in celery_app.py, so allow more than that to drain.
stopwaitsecs=660
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
priority=30
